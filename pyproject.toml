[project]
name = "ml-trading-platform-backend"
version = "0.1.0"
description = "Research and paper-trading backend for the ML Trading Platform"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=2.0,<3",
    "pandas~=2.3.0",
    "scipy>=1.11",
    "ta==0.11.0",
    "scikit-learn~=1.7",
    "xgboost>=2.0",
    "lightgbm>=4.0,<5",
    "statsmodels>=0.14",
    "arch>=6.0",
    "yfinance>=0.2.31",
    "alpaca-py>=0.21",
    "requests>=2.31",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.25",
    "python-dotenv>=1.0",
    "schedule>=1.2",
    "anthropic>=1.11,<2",
    "exchange-calendars>=4.13.2",
    "tenacity>=9.1.4",
    "pyarrow>=25.0.1",
    "pydantic-settings>=2.15.0",
    "joblib>=1.3",
    "ib-async>=2.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-socket>=0.7",
    "hypothesis>=6",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: statistical simulations, run nightly",
    "live: needs real API keys and network; opt-in only",
]
xfail_strict = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
